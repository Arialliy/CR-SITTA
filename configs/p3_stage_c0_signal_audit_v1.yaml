teacher:
  source: sealed_nonadaptive_teacher_base_view_probabilities
  array_name: base_view_probabilities
  accepted_view_names: [identity, hflip, vflip, hvflip]
  accepted_view_indices: [0, 1, 2, 3]
  aggregation: median
  detached_required: true
  probability_eps: 1.0e-6
  variance_threshold: 0.01
  target_threshold: 0.10
  background_threshold: 0.01
  uncertainty_temperature: 0.01
  protection_radius: 3
  candidate_threshold: 0.50
  candidate_min_area: 1
  ring_inner_radius: 3
  ring_outer_radius: 7
  local_contrast_radius: 3

deterioration_bank:
  input_space: physical_RGB_0_1_before_ImageNet_normalization
  every_probe_runs_for_every_condition: true
  benchmark_condition_name_available_to_probe: false
  benchmark_severity_available_to_probe: false
  seed_derivation_fields:
    - protocol_id
    - global_seed
    - canonical_image_id
    - probe_id
    - method_facing_input_tensor_sha256
  probes:
    - id: lf_mask
      kind: low_frequency_amplitude_mask
      mask_ratio: 0.20
      keep_probability: 0.50
    - id: hf_noise
      kind: high_frequency_noise
      target_rms: 0.02
      low_cut_ratio: 0.20

objective:
  name: active_region_balanced_bootstrap_plus_local_contrast
  entropy_margin: 0.01
  min_active_pixels: 1
  probability_eps: 1.0e-6
  lambda_foreground: 1.0
  lambda_background: 1.0
  lambda_local_contrast: 0.10
  lambda_router_l2: 0.0
  lambda_router_spatial_tv: 0.0
  candidate_weighting: equal_per_candidate_sum_to_one
  empty_candidate_weight: empty_tensor
  local_contrast_temperature: 0.25
  local_contrast_ring_weight: 1.0
  local_contrast_huber_delta: 1.0
  foreground_background_separately_normalized: true

parameter_spaces:
  R-E1:
    type: spatial_low_rank_film
    insertion: fpn_x_e1
    channels: 64
    rank: 4
    grid_size: [8, 8]
    max_scale_delta: 0.05
    max_bias: 0.05
    expected_parameter_tensor_count: 2
    expected_scalar_parameter_count: 512
    normalized_virtual_step_l2_radius: 0.25
  R-D0:
    type: spatial_low_rank_film
    insertion: decoder_x_d0
    channels: 16
    rank: 2
    grid_size: [8, 8]
    max_scale_delta: 0.05
    max_bias: 0.05
    expected_parameter_tensor_count: 2
    expected_scalar_parameter_count: 256
    normalized_virtual_step_l2_radius: 0.25
  P2:
    type: bn_affine
    group_spec: decoder_low
    expected_parameter_tensor_count: 16
    expected_scalar_parameter_count: 416
    normalized_virtual_step_radius_mode: relative_to_source_parameter_l2
    normalized_virtual_step_relative_radius: 0.0005
  ordered: [R-E1, R-D0, P2]
  router_basis_seed: 3407

outer_oracle_task_loss:
  role: train_only_pilot64_outer_evaluator_gradient_alignment
  used_by_adaptation: false
  lambda_bce: 1.0
  lambda_soft_iou: 1.0
  eps: 1.0e-6
  bce_reduction: mean_over_all_pixels
  soft_iou_reduction: mean_over_sample
  empty_target_convention: epsilon_smoothed_union_penalizes_foreground
  normalized_virtual_step:
    direction: negative_proxy_gradient
    nonzero_epsilon: 1.0e-12
    threshold_crossing_probability: 0.5
    threshold_rule: strict_greater_than
    threshold_crossing_role: report_only_not_stage_c0_hard_gate

stage_c0_signal_gate:
  eligibility_evaluated_before_followup_authorization: true
  ranking_at_c0: forbidden
  no_eligible_is_normal_scientific_result: true
  nonclean_finite_nonzero_proxy_gradient_fraction_minimum: 0.80
  nonclean_active_support_episode_fraction_minimum: 0.30
  active_support_only_far_background_allowed: false
  minimum_positive_dataset_macro_task_gradient_cosines: 2
  dataset_count: 3
  nonclean_macro_task_gradient_cosine_strictly_greater_than: 0.08
  minimum_improving_directional_derivative_families: 3
  corruption_family_count: 4
  task_directional_derivative_improvement_rule: strictly_less_than_zero
  identity_adapter_source_output: bit_exact
  c0_failure_action: stop_without_stage_c1
  c0_success_action: authorize_train_only_stage_c1_crossfit
  formal_test_authorized: false


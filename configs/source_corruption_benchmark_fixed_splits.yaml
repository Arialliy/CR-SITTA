schema_version: 1
protocol_id: nsfpn-source-corruption-benchmark-fixed-splits-v1
created_at: "2026-08-26"

scope:
  stage: formal_source_corruption_benchmark
  paper_result: true
  checkpoint_selection_or_tuning_allowed: false
  full_fixed_test_split_required: true

source:
  architecture: MSHNet_NSFPN
  checkpoint_role: best_miou
  checkpoint_selection: test_selected
  checkpoint_disclosure: >-
    The locked best_miou checkpoints were selected by repeated fixed-test
    evaluation during epochs 500-1000. This benchmark performs no further
    checkpoint, corruption, threshold, or hyperparameter selection.
  parent_training_protocol: configs/retrain_fixed_splits.yaml
  parent_training_protocol_sha256: 17a194da4a09972906c24ac7bb25d2dd14b0d6fc67ceb1d7b8aff99f1b43c515
  warm_flag: false
  batch_size: 1

corruption:
  seed: 42
  sample_seed_key: [image_id, corruption, severity, base_seed]
  severity_table: corruptions/severity_tables.yaml
  severity_table_sha256: c3218738fd32f2cfa2a24731456d9dc18fa648eb7b0b6e1fbd5175c605ba0536
  severity_table_frozen: true
  pilot_protocol_archive: configs/corruption_pilot_fixed_splits_round_02.yaml
  pilot_protocol_archive_sha256: 62d825a2497da671de2bb6b54d5e85e96992a670404ad07c860a8bdf4ab16c5e
  pilot_report: results/corruption_pilot_fixed_split/round_02/calibration_report.json
  pilot_report_sha256: 26e9de24f400a40e36ae461f56bba3a3edab23f6565c32a0dc1a12f17e85951b
  conditions:
    clean: [0]
    gaussian_noise: [1, 3, 5]
    gaussian_blur: [1, 3, 5]
    low_contrast: [1, 3, 5]
    stripe_noise: [1, 3, 5]
  ordered_conditions:
    - [clean, 0]
    - [gaussian_noise, 1]
    - [gaussian_noise, 3]
    - [gaussian_noise, 5]
    - [gaussian_blur, 1]
    - [gaussian_blur, 3]
    - [gaussian_blur, 5]
    - [low_contrast, 1]
    - [low_contrast, 3]
    - [low_contrast, 5]
    - [stripe_noise, 1]
    - [stripe_noise, 3]
    - [stripe_noise, 5]
  condition_count_per_dataset: 13

preprocessing:
  image_color_space: RGB
  image_resize: {size: [256, 256], interpolation: bilinear}
  mask_resize: {size: [256, 256], interpolation: nearest}
  image_range_before_corruption: [0.0, 1.0]
  normalization:
    name: ImageNet
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    order: after_corruption
  mask_corrupted: false

materialized_cache:
  root: results/corruption_cache_fixed_split_v1
  generation_protocol_archive: configs/source_corruption_cache_generation_v1.yaml
  generation_protocol_sha256: c8cdd858e293dbad67660869361637b96af34f54c5cfd36ac127d9ee75fad912
  immutable_after_completion: true
  overwrite_existing_complete_cache: false
  build_in_sibling_staging_directory: true
  publish_with_atomic_directory_rename: true
  require_complete_sentinel: true
  independent_regeneration_bit_exact_check: true
  images:
    format: numpy_npy
    dtype: little_endian_float32
    shape: [N, 3, 256, 256]
    domain: imagenet_normalized_after_physical_corruption
    contiguous_order: C
    one_file_per_condition: true
  targets:
    format: numpy_npy
    dtype: little_endian_float32
    shape: [N, 1, 256, 256]
    one_file_per_dataset: true
  required_hashes:
    - ordered_ids_sha256
    - tensor_sequence_sha256
    - file_sha256
    - manifest_sha256
  consumers_must_not_regenerate_corruptions: true
  consumers_use_read_only_mmap_and_private_sample_copy: true
  label_firewall: adaptation_receives_image_and_metadata_only

evaluation:
  probability_transform: sigmoid_once
  fixed_probability_threshold: 0.5
  threshold_rule: strict_greater_than
  froc_probability_thresholds:
    [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45,
     0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]
  foreground_connectivity_2d: 8
  target_matching:
    assignment: hungarian_minimum_centroid_distance
    max_centroid_distance_pixels: 3.0
    comparison: strict_less_than
    one_to_one: true
  report:
    - legacy_mean_iou
    - unified_global_iou
    - pd
    - fa_per_million_pixels
    - false_positives_per_image
    - froc

outputs:
  root: results/source_corruption_benchmark_fixed_split_v1
  save_all_binary_prediction_masks: true
  save_probability_maps: true
  probability_storage: one_float32_npy_shard_per_condition
  save_per_image_records: true
  clean_must_match_existing_source_export: true

clean_parity_gate:
  run_before_corrupted_conditions: true
  ordered_ids_exact: true
  cached_inputs_and_targets_verified_bit_exact_upstream: true
  probability_arrays_bit_exact: true
  binary_mask_arrays_bit_exact: true
  binary_mask_file_hashes_exact: true
  official_metrics_exact: true
  unified_metrics_exact: true
  metric_container_comparison: exact_after_json_tuple_list_canonicalization
  numeric_tolerance_enabled: false
  checkpoint_operating_point_exact: true
  repeat_logits_first_image_bit_exact: true
  model_state_unchanged: true


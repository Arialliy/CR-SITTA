schema_version: 1
protocol_id: nsfpn-fixed-split-corruption-pilot-v1
created_at: "2026-08-26"

scope:
  stage: pilot_completed
  purpose: calibrate_shared_corruption_severity
  paper_result: false
  read_test_split_metadata_for_leakage_guard: true
  use_test_images: false
  use_test_labels: false

source:
  architecture: MSHNet_NSFPN
  checkpoint_role: best_miou
  checkpoint_selection: test_selected
  checkpoint_disclosure: >-
    The locked best_miou checkpoint was selected by repeated evaluation of the
    fixed test split during source training. The corruption Pilot itself reads
    the fixed test split text only for leakage checks and never opens test
    images or labels.
  parent_training_protocol: configs/retrain_fixed_splits.yaml
  parent_training_protocol_sha256: 17a194da4a09972906c24ac7bb25d2dd14b0d6fc67ceb1d7b8aff99f1b43c515
  warm_flag: false
  batch_size: 1

pilot:
  calibration_round: 2
  subset_size_per_dataset: 64
  subset_selection: ascending_sha256_of_utf8_canonical_image_id
  base_seed: 42
  sample_seed_key: [image_id, corruption, severity, base_seed]
  conditions:
    clean: [0]
    gaussian_noise: [1, 2, 3, 4, 5]
    gaussian_blur: [1, 2, 3, 4, 5]
    low_contrast: [1, 2, 3, 4, 5]
    stripe_noise: [1, 2, 3, 4, 5]
  condition_count_per_dataset: 21
  required_checks:
    - exact_input_reproduction_per_condition
    - gt_mask_hash_identical_across_conditions
    - identical_ordered_ids_across_conditions
    - zero_fixed_test_id_overlap
    - model_state_unchanged
    - clean_transform_exact_identity
    - corruption_before_normalization

preprocessing:
  image_color_space: RGB
  image_resize: {size: [256, 256], interpolation: bilinear}
  mask_resize: {size: [256, 256], interpolation: nearest}
  image_range_before_corruption: [0.0, 1.0]
  normalization:
    name: ImageNet
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    order: after_corruption
  mask_corrupted: false

evaluation:
  probability_transform: sigmoid_once
  fixed_probability_threshold: 0.5
  froc_probability_thresholds:
    [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45,
     0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]
  foreground_connectivity_2d: 8
  target_matching:
    assignment: hungarian_minimum_centroid_distance
    max_centroid_distance_pixels: 3.0
    comparison: strict_less_than
    one_to_one: true

severity_table:
  path: corruptions/severity_tables.yaml
  status: fixed_split_v1_frozen_after_round2_train_pilot
  frozen: true
  sha256: c3218738fd32f2cfa2a24731456d9dc18fa648eb7b0b6e1fbd5175c605ba0536
  shared_across_datasets: true
  acceptance_criteria: configs/corruption_pilot_acceptance.yaml

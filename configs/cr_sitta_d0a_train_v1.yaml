schema_version: 1
protocol_id: cr-sitta-d0a-supervised-lfhf-train-1000e-v1
created_at: "2026-09-04"

scope:
  stage: D0-A
  role: train_only_supervised_degraded_view_compatibility
  development_only: true
  paper_result: false
  no_validation_split: true
  use_validation_payload: false
  use_test_payload: false
  validation_payload_opens_required: 0
  test_payload_opens_required: 0
  result_root: results/cr_sitta/d0a_supervised_lfhf_train_v1
  scientific_claim: >-
    This stage trains on supervised LF/HF degraded source views. It does not by
    itself establish proxy/task gradient alignment; that claim requires the
    subsequent frozen Pilot64 Stage-C0 gradient gate.

training:
  derived_from: configs/retrain_fixed_splits.yaml
  architecture: MSHNet_NSFPN
  initialization: random
  epochs: 1000
  batch_size: 16
  optimizer: Adagrad
  learning_rate: 0.05
  warm_epochs: 5
  base_size: 256
  crop_size: 224
  seed: 42
  num_workers: 8
  expected_state_dict_keys: 505
  degraded_branch_batchnorm: eval_no_running_stat_update
  official_train_only: true
  test_evaluation_during_training: false
  validation_evaluation_during_training: false
  checkpoint_selection:
    rule: fixed_final_epoch
    epoch: 1000
    output_name: epoch_1000_train_only.pth.tar
    best_miou: forbidden_without_train_internal_oof_rule
    best_pd: forbidden_without_train_internal_oof_rule

objective:
  name: clean_plus_supervised_degraded_view_segmentation
  clean_segmentation_loss_weight: 1.0
  degraded_segmentation_loss_weight: 1.0
  lambda_degraded: 1.0
  normalization: divide_by_one_plus_lambda_degraded
  degraded_view_uses_source_train_target: true
  pseudo_labels: false
  entropy_minimization: false
  test_time_objective_enabled: false

deterioration_views:
  input_space: physical_RGB_0_1_before_ImageNet_normalization
  schedule: deterministic_alternating_per_optimizer_step
  ordered_probe_ids: [lf_mask, hf_noise]
  benchmark_condition_name_available_to_probe: false
  benchmark_severity_available_to_probe: false
  seed_derivation_fields:
    - protocol_id
    - global_seed
    - dataset_id
    - epoch
    - canonical_image_id
    - probe_id
  probes:
    lf_mask:
      kind: low_frequency_amplitude_mask
      mask_ratio: 0.20
      keep_probability: 0.50
    hf_noise:
      kind: high_frequency_noise
      target_rms: 0.02
      low_cut_ratio: 0.20

smoke_gate:
  required_before_full_1000e: true
  data_role: train_only
  separate_result_root: results/cr_sitta/engineering_smoke/d0a_supervised_lfhf_train_v1
  requirements:
    deterministic_repeat: exact
    target_unchanged: true
    finite_losses_and_gradients: true
    both_clean_and_degraded_losses_have_gradient: true
    alternating_probe_count_conserved: true
    validation_payload_opens: 0
    test_payload_opens: 0
  on_failure: stop_before_full_training

post_training_gate:
  checkpoint_input: epoch_1000_train_only.pth.tar
  next_stage: frozen_Pilot64_original_Stage-C0_gradient_gate
  stage_c0_required_before_tta: true
  stage_c0_required_before_formal_test: true
  on_no_eligible_parameter_space: stop_no_tta_no_formal_test

checkpoint_disclosure:
  current_protocol_checkpoint_test_selected: false
  current_protocol_checkpoint_selection_source: fixed_epoch_1000_train_only
  upstream_baseline_best_miou_test_selected: true
  upstream_baseline_best_pd_test_selected: true
  upstream_development_only: true
  statement: >-
    The earlier baseline best_miou and best_pd checkpoints were selected by
    repeated evaluation of the fixed test split from epoch 500 through 1000.
    They remain development-only, test-selected comparators and must not select
    D0-A hyperparameters, epochs, candidates, or formal-test claims. D0-A emits
    only the preregistered epoch-1000 train-only checkpoint.


schema_version: 1
protocol_id: cr-sitta-binary-tent-source-calibration-cache-v1
created_at: "2026-08-27"

scope:
  stage: source_train_derived_hyperparameter_calibration_input_cache
  purpose: materialize_shared_binary_tent_optimizer_lr_calibration_inputs
  paper_result: false
  independent_validation_set: false
  use_test_images: false
  use_test_labels: false
  test_split_metadata_for_leakage_guard_only: true
  adaptation_interface_invoked: false
  adaptation_receives_labels: false
  targets_role: outer_source_side_calibration_evaluator_only
  target_transition_hyperparameter_selection_allowed: false

source:
  architecture: MSHNet_NSFPN
  checkpoint_role: best_miou
  checkpoint_selection: test_selected
  checkpoint_disclosure: >-
    The locked best_miou checkpoints were selected by repeated evaluation of
    the fixed test split during source training. This train-derived cache adds
    no test-image or test-label access and performs no model selection.
  parent_training_protocol: configs/retrain_fixed_splits.yaml
  parent_training_protocol_sha256: 17a194da4a09972906c24ac7bb25d2dd14b0d6fc67ceb1d7b8aff99f1b43c515
  warm_flag: false
  batch_size: 1


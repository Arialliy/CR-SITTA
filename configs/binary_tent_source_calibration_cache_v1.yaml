    test_source.py: 76f2737d0c3e01b0eeac3ad5398d67460bb7ab014ec703449653e8aec729a13c

input_protocol:
  subset_size_per_dataset: 64
  subset_role: fixed_train_derived_calibration_subset
  subset_selection: ascending_sha256_of_utf8_canonical_image_id
  seed: 42
  sample_seed_key: [image_id, corruption, severity, base_seed]
  ordered_conditions:
    - [clean, 0]
    - [gaussian_noise, 1]
    - [gaussian_noise, 3]
    - [gaussian_noise, 5]
    - [gaussian_blur, 1]
    - [gaussian_blur, 3]
    - [gaussian_blur, 5]
    - [low_contrast, 1]
    - [low_contrast, 3]
    - [low_contrast, 5]
    - [stripe_noise, 1]
    - [stripe_noise, 3]
    - [stripe_noise, 5]
  condition_count_per_dataset: 13

preprocessing:
  image_color_space: RGB
  image_resize: {size: [256, 256], interpolation: bilinear}
  mask_resize: {size: [256, 256], interpolation: nearest}
  image_range_before_corruption: [0.0, 1.0]
  normalization:
    name: ImageNet
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    order: after_corruption
  mask_corrupted: false

materialized_cache:
  root: results/binary_tent/source_calibration_cache_v1
  cache_format: nsfpn-materialized-source-calibration-cache-v1
  immutable_after_completion: true
  overwrite_existing_complete_cache: false
  build_in_sibling_staging_directory: true
  publish_with_atomic_directory_rename: true
  exclusive_sibling_publish_lock: true
  require_complete_sentinel: true
  consumers_must_not_regenerate_corruptions: true
  consumers_use_read_only_mmap_and_private_sample_copy: true
  images:
    format: numpy_npy
    dtype: little_endian_float32
    shape: [64, 3, 256, 256]
    domain: imagenet_normalized_after_physical_corruption
    contiguous_order: C
    one_file_per_condition: true
  targets:
    format: numpy_npy
    dtype: little_endian_float32
    shape: [64, 1, 256, 256]
    one_file_per_dataset: true
    path: outer_evaluator/targets.npy
    method_facing_access: forbidden
    outer_evaluator_access: allowed_after_episode
    outer_evaluator_requires_explicit_episodes_complete: true
  official_consumers:
    method_facing: SourceCalibrationMethodInputDataset
    method_facing_manifest: method_input_manifest.json
    expected_protocol_sha256_required: true
    method_facing_fields:
      [image, image_id, original_size, dataset, corruption, severity, seed]
    outer_evaluator_targets: load_outer_evaluator_targets
    generic_cached_corruption_dataset_for_adaptation: forbidden
  required_hashes:
    - ordered_ids_sha256
    - source_file_manifest_sha256
    - tensor_sequence_sha256
    - file_sha256
    - manifest_sha256
    - method_input_manifest_sha256
  runtime_seal:
    enabled: true
    binds:
      - launch_protocol
      - all_materializer_provenance_paths
    verify_at:
      - process_entry
      - validation_complete
      - materialization_start
      - after_every_condition
      - before_manifest_write
      - before_atomic_publish
    drift_policy: fail_closed_and_do_not_publish
    record_in_manifest_and_complete: true


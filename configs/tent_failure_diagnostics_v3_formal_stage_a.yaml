replicate_execution:
  replicate_ids: [R0, R1, R2]
  seed: 42
  same_frozen_inputs_across_replicates: true
  same_seed_across_replicates: true
  independent_fresh_process_per_replicate: true
  r0_candidate_policy: all_10_frozen_candidates
  r0_cells_per_candidate: 39
  r0_episodes_per_candidate: 2496
  r0_total_candidate_episodes: 24960
  followup_candidate_policy: r0_scientifically_eligible_only
  followup_replicates: [R1, R2]
  followup_cells_per_candidate_per_replicate: 39
  followup_episodes_per_candidate_per_replicate: 2496
  gradient_reuse: forbidden
  fresh_model_method_optimizer_per_candidate_image: true
  formal_completion_rule: >-
    All ten candidates have a complete R0; each R0-eligible candidate has
    complete independent R1 and R2; no R0-ineligible candidate is executed in
    R1 or R2. An empty R0 eligible set is a complete early-stop outcome.


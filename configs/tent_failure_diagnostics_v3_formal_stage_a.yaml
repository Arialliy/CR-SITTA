formal_numeric_protocol:
  no_op_thresholds:
    parameter_null_floor: 0.0
    logit_null_floor: 0.0
    probability_null_floor: 0.0
    probability_logit_consistency_atol: 1.0e-6
    prediction_threshold: 0.5
    near_threshold_lower: 0.45
    near_threshold_upper: 0.55
    entropy_eps: 1.0e-6
    connectivity: 2
    min_component_area: 1
    max_centroid_distance: 3.0
  optimizer_geometry:
    inherited_from_parent_v2: true
    runtime_hard_gate_reference: pytorch_2_1_2_single_tensor_same_device_native_dtype_bit_exact_after_v1
    cross_backend_cpu_storage_replay_reference: pytorch_2_1_2_cpu_snapshot_native_dtype_cross_backend_storage_replay_diagnostic_v1
    continuous_ideal_reference: continuous_float64_empty_state_first_step_v1
    small_gradient_threshold: 1.0e-8
    adam_near_sign_step_threshold: 0.9
    verification_rtol: 1.0e-5
    verification_atol: 1.0e-7
  outer_oracle_task_loss:
    role: train_only_outer_evaluator_gradient_alignment
    used_by_adaptation: false
    lambda_bce: 1.0
    lambda_soft_iou: 1.0
    eps: 1.0e-6
    bce_reduction: mean_over_all_pixels
    soft_iou_reduction: mean_over_sample
    empty_target_convention: epsilon_smoothed_union_penalizes_foreground
  alignment:
    first_order_zero_tolerance: 0.0
    selection_cosine_unit: per_episode_global_all_BN_affine_vector
    zero_gradient_norm_policy: cosine_null_with_reason_code
    selection_macro: equal_episode_mean_over_valid_global_cosines
    selection_dataset_statistic: median_over_valid_global_cosines
    both_gradients_nonzero_episode_denominator: 2496
    fine_group_observations_per_candidate_replicate: 49920
    fine_group_role: diagnostic_only_not_selection
  aggregation_semantics:
    cell_sufficient_statistics: pooled_over_64_images_before_metric_computation
    global_iou:
      numerator: pooled_intersection_pixels
      denominator: pooled_union_pixels
      zero_union_value: 1.0
      convention: official
    pd:
      numerator: pooled_detected_targets
      denominator: pooled_total_targets
      zero_target_value: 0.0
    fa_per_million_pixels:
      numerator: pooled_false_alarm_pixels
      denominator: pooled_total_image_pixels
      multiplier: 1000000.0
    foreground_fraction:
      numerator: pooled_predicted_positive_pixels
      denominator: pooled_total_image_pixels
    cross_cell_aggregation: equal_cell_macro
    macro_cell_counts:
      overall: 39
      nonclean: 36
      clean: 3
      per_dataset_nonclean: 12
      per_corruption_family: 9

stage_a_science_gate:
  comparison_tolerance: 1.0e-12
  filter_before_ranking: true
  no_eligible_is_normal_scientific_result: true
  r0_no_eligible_action: stop_without_R1_R2
  final_no_eligible_action: stop_P3_parameter_update_route
  every_replicate_must_pass_all_hard_gates: true
  per_replicate:
    nonclean_36_macro_delta_iou_strictly_greater_than: 0.0
    minimum_positive_nonclean_datasets: 2
    worst_nonclean_dataset_delta_iou_minimum: -0.002
    minimum_positive_corruption_families: 3
    worst_corruption_family_delta_iou_minimum: -0.005
    overall_39_macro_delta_iou_strictly_greater_than: 0.0
    clean_macro_delta_iou_minimum: -0.002
    each_clean_dataset_delta_iou_minimum: -0.005
    nonclean_macro_delta_pd_minimum: -0.010
    each_nonclean_dataset_delta_pd_minimum: -0.020
    clean_macro_delta_pd_minimum: -0.010
    fa_delta_maximum_formula:
      absolute_allowance_per_million_pixels: 10.0
      source_fa_multiplier: 0.25
      required_strata: [overall, nonclean, clean, dataset, corruption_family]
    foreground_fraction:
      delta_maximum: 0.001
      adapted_maximum_formula: source_times_1.20_plus_1e_minus_6
      source_multiplier: 1.20
      epsilon: 1.0e-6
      required_strata: [overall, nonclean, clean, dataset, corruption_family]
    finite_gradient_fraction_minimum: 1.0
    parameter_changed_episode_fraction_minimum: 0.95
    functional_logit_threshold: 1.0e-6
    functional_logit_changed_episode_fraction_minimum: 0.10
    threshold_crossing_episode_fraction_minimum: 0.02
    metric_sufficient_count_changed_episode_fraction_minimum: 0.02
    entropy_decrease_episode_fraction_minimum: 0.80
    alignment_macro_cosine_minimum: 0.05
    minimum_positive_alignment_dataset_medians: 2
    both_gradients_nonzero_fraction_minimum: 0.80
  across_R0_R1_R2:
    nonclean_36_macro_delta_iou_mean_minimum: 0.002
    overall_39_macro_delta_iou_mean_minimum: 0.001
  ranking_tie_break_order:
    - higher_three_replicate_mean_nonclean_delta_iou
    - higher_worst_replicate_nonclean_delta_iou
    - higher_minimum_dataset_three_replicate_mean_nonclean_delta_iou
    - higher_three_replicate_mean_clean_delta_iou
    - lower_three_replicate_mean_nonclean_fa_delta
    - lower_three_replicate_mean_nonclean_foreground_fraction_inflation
    - higher_three_replicate_mean_nonclean_delta_pd
    - lower_learning_rate
    - fixed_optimizer_order_Adam_then_SGD
    - lexicographically_lower_candidate_id
  top_k: null
  stage2_authorized_by_gate: false


schema_version: 2
protocol_id: cr-sitta-d0-v2-independent-candidates
created_at: "2026-09-02"

scope:
  phase: D0_v2_independent_candidate_engineering
  source_train_derived: true
  paper_result: false
  paper_test_result: false
  no_validation_split: true
  use_validation: false
  allowed_split_roles: [train_pilot64, test_metadata_only_for_leakage_guard]
  use_test_images: false
  use_test_labels: false
  method_label_accesses: 0
  scientific_gate_status: unresolved
  scientific_selection_performed: false
  stage2_authorized: false
  disclosure: >-
    Engineering-only D0-v2 diagnosis on the frozen 64-image source-train
    Pilot. It performs no validation, opens no test image or mask, makes no
    scientific selection, and cannot authorize Stage 2.


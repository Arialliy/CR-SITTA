training:
  architecture: MSHNet_NSFPN
  initialization: random
  epochs: 1000
  evaluation_start_epoch: 500
  evaluation_frequency: 1
  batch_size: 16
  optimizer: Adagrad
  learning_rate: 0.05
  warm_epochs: 5
  base_size: 256
  crop_size: 224
  seed: 42
  checkpoint_selection:
    best_miou: maximize_miou_then_pd_then_minimize_fa
    best_pd: maximize_pd_then_minimize_fa_then_miou
  disclosure: >-
    The fixed test split is evaluated after every epoch from epoch 500 through
    epoch 1000 and is used to select both exported best checkpoints. These are
    test-selected checkpoints, not estimates from an untouched final test set.


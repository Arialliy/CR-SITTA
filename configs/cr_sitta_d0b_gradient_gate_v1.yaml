ordered_conditions:
  - [clean, 0]
  - [gaussian_noise, 1]
  - [gaussian_noise, 3]
  - [gaussian_noise, 5]
  - [gaussian_blur, 1]
  - [gaussian_blur, 3]
  - [gaussian_blur, 5]
  - [low_contrast, 1]
  - [low_contrast, 3]
  - [low_contrast, 5]
  - [stripe_noise, 1]
  - [stripe_noise, 3]
  - [stripe_noise, 5]

teacher:
  source: freshly_rebuilt_from_each_d0a_epoch1000_safe_checkpoint
  array_name: base_view_probabilities
  accepted_view_names: [identity, hflip, vflip, hvflip]
  accepted_view_indices: [0, 1, 2, 3]
  stored_view_names: [identity, hflip, vflip, hvflip, context_tile]
  aggregation: median
  detached_required: true
  probability_eps: 1.0e-6
  variance_threshold: 0.01
  target_threshold: 0.10
  background_threshold: 0.01
  uncertainty_temperature: 0.01
  protection_radius: 3
  candidate_threshold: 0.50
  candidate_min_area: 1
  ring_inner_radius: 3
  ring_outer_radius: 7
  local_contrast_radius: 3

deterioration_bank:
  input_space: physical_RGB_0_1_before_ImageNet_normalization
  every_probe_runs_for_every_condition: true
  benchmark_condition_name_available_to_probe: false
  benchmark_severity_available_to_probe: false
  probe_seed_namespace: cr-sitta-p3-stage-c0-signal-audit-v1
  probes:
    - id: lf_mask
      kind: low_frequency_amplitude_mask
      mask_ratio: 0.20
      keep_probability: 0.50
    - id: hf_noise
      kind: high_frequency_noise
      target_rms: 0.02
      low_cut_ratio: 0.20

objective:
  name: active_region_balanced_bootstrap_plus_local_contrast
  entropy_margin: 0.01
  min_active_pixels: 1
  probability_eps: 1.0e-6
  lambda_foreground: 1.0
  lambda_background: 1.0
  lambda_local_contrast: 0.10
  lambda_router_l2: 0.0
  lambda_router_spatial_tv: 0.0
  candidate_weighting: equal_per_candidate_sum_to_one
  empty_candidate_weight: empty_tensor
  local_contrast_temperature: 0.25
  local_contrast_ring_weight: 1.0
  local_contrast_huber_delta: 1.0
  foreground_background_separately_normalized: true

parameter_spaces:
  R-E1:
    type: spatial_low_rank_film
    insertion: fpn_x_e1
    channels: 64
    rank: 4
    grid_size: [8, 8]
    max_scale_delta: 0.05
    max_bias: 0.05
    expected_parameter_tensor_count: 2
    expected_scalar_parameter_count: 512
    normalized_virtual_step_l2_radius: 0.25
  R-D0:
    type: spatial_low_rank_film
    insertion: decoder_x_d0
    channels: 16
    rank: 2
    grid_size: [8, 8]
    max_scale_delta: 0.05
    max_bias: 0.05
    expected_parameter_tensor_count: 2
    expected_scalar_parameter_count: 256
    normalized_virtual_step_l2_radius: 0.25
  P2:
    type: bn_affine
    group_spec: decoder_low
    expected_parameter_tensor_count: 16
    expected_scalar_parameter_count: 416
    normalized_virtual_step_radius_mode: relative_to_source_parameter_l2
    normalized_virtual_step_relative_radius: 0.0005
  ordered: [R-E1, R-D0, P2]
  router_basis_seed: 3407

outer_oracle_task_loss:
  role: train_only_pilot64_outer_evaluator_gradient_alignment
  used_by_adaptation: false
  lambda_bce: 1.0
  lambda_soft_iou: 1.0
  eps: 1.0e-6
  bce_reduction: mean_over_all_pixels
  soft_iou_reduction: mean_over_sample
  empty_target_convention: epsilon_smoothed_union_penalizes_foreground
  normalized_virtual_step:
    direction: negative_proxy_gradient
    nonzero_epsilon: 1.0e-12
    threshold_crossing_probability: 0.5
    threshold_rule: strict_greater_than
    threshold_crossing_role: report_only_not_stage_c0_hard_gate

stage_c0_signal_gate:
  mechanism_id: ASB-SFR_C0
  dataset_ids: [IRSTD-1K, NUAA-SIRST, NUDT-SIRST]
  family_ids: [gaussian_noise, gaussian_blur, low_contrast, stripe_noise]
  space_ids: [R-E1, R-D0, P2]
  space_virtual_step_contracts:
    R-E1:
      radius_mode: absolute_l2
      radius_value: 0.25
      nonzero_epsilon: 1.0e-12
      direction: negative_proxy_gradient
      clip_rule: min_1_radius_over_norm_plus_epsilon
    R-D0:
      radius_mode: absolute_l2
      radius_value: 0.25
      nonzero_epsilon: 1.0e-12
      direction: negative_proxy_gradient
      clip_rule: min_1_radius_over_norm_plus_epsilon
    P2:
      radius_mode: relative_to_source_parameter_l2
      radius_value: 0.0005
      nonzero_epsilon: 1.0e-12
      direction: negative_proxy_gradient
      clip_rule: min_1_radius_over_norm_plus_epsilon
  expected_nonclean_probe_episode_count: 4608
  expected_nonclean_probe_episode_count_per_dataset: 1536
  expected_nonclean_probe_episode_count_per_family: 1152
  expected_identity_comparison_count_per_space: 192
  minimum_nonclean_finite_nonzero_proxy_gradient_fraction: 0.80
  minimum_nonclean_active_support_episode_fraction: 0.30
  minimum_candidate_proximal_active_episode_fraction_among_active: 0.05
  dataset_cosine_strictly_greater_than: 0.0
  minimum_positive_dataset_cosines: 2
  macro_cosine_strictly_greater_than: 0.08
  virtual_task_derivative_improvement_relation: strictly_less_than_zero
  minimum_improving_families: 3
  require_identity_bit_exact: true
  filter_before_reporting_eligible_spaces: true
  zero_signal_spaces_eligible: false

implementation:
  # All are hashed into PRE_RUN_FREEZE.  The old runner is execution logic,
  # never an input artifact; its hash is additionally pinned above.
  critical_code_paths:
    - run_cr_sitta_d0b_gradient_gate_v1.py

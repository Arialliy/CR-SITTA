artifact_policy:
  checkpoint_dependent_artifacts_must_be_rebuilt:
    - strong_teacher
    - candidate_masks_and_region_weights
    - source_probabilities
    - proxy_gradients
    - outer_task_gradients
    - aggregate_evidence
  forbidden_input_roots:
    - results/cr_sitta/nonadaptive_teacher_screen_v1
    - results/cr_sitta/p3_stage_c0_signal_audit_v1
    - results/cr_sitta/p3_stage_c0_signal_audit_v2
    - results/cr_sitta/p3_stage_c0_aggregate_recovery_v1
    - results/retraining_fixed_split
    - results/baseline
  permitted_reuse:
    artifact: image_only_13_condition_Pilot64_cache
    checkpoint_independent_proof_required: true
    rehash_and_rebind_in_pre_run_freeze: true
  authorization_output: D1_AUTHORIZATION.json
  forbidden_authorization_fields:
    - stage_c1_allowed
    - stage_c_r1_r2_allowed
    - formal_test_authorized
  may_authorize_only: D1_train_internal_OOF
  formal_test_allowed: false


ordered_conditions:
  - [clean, 0]
  - [gaussian_noise, 1]
  - [gaussian_noise, 3]
  - [gaussian_noise, 5]
  - [gaussian_blur, 1]
  - [gaussian_blur, 3]
  - [gaussian_blur, 5]
  - [low_contrast, 1]
  - [low_contrast, 3]
  - [low_contrast, 5]
  - [stripe_noise, 1]
  - [stripe_noise, 3]
  - [stripe_noise, 5]

views:
  probability_space_aggregation: true
  model_mode: frozen_source_eval
  requires_grad: false
  flip4:
    ordered_views: [identity, hflip, vflip, hvflip]
    exact_inverse_alignment: true
  tile5:
    ordered_views: [identity, hflip, vflip, hvflip, tile_reconstruction]
    exact_inverse_alignment_for_flip_views: true
  tile_reconstruction:
    crop_size: 224
    ordered_origins: [[0, 0], [0, 32], [32, 0], [32, 32]]
    canvas_size: [256, 256]
    model_input_size: [256, 256]
    input_resize: {mode: bilinear, align_corners: false}
    inverse_probability_resize: {mode: bilinear, align_corners: false}
    overlap_reduction: arithmetic_mean_over_valid_predictions
    complete_canvas_coverage_required: true
  rotation:
    enabled: false
    fail_closed: true
  scale:
    enabled: false
    fail_closed: true

aggregation:
  trim_count_each_tail: 1
  disagreement_tau: 0.01
  disagreement_weight_formula: "exp(-(p_m-minus-view_mean)^2/tau)"
  source_anchor_inner_aggregation: mean
  source_anchor_betas: [0.25, 0.5]
  probability_bounds: [0.0, 1.0]
  finite_required: true

candidates:
  - {id: flip4_mean, view_set: flip4, aggregation: mean}
  - {id: flip4_trimmed, view_set: flip4, aggregation: trimmed}
  - {id: flip4_disagreement_weighted, view_set: flip4, aggregation: disagreement_weighted}
  - {id: flip4_source_anchor_beta_0_25, view_set: flip4, aggregation: source_anchor, beta: 0.25}
  - {id: flip4_source_anchor_beta_0_5, view_set: flip4, aggregation: source_anchor, beta: 0.5}
  - {id: tile5_mean, view_set: tile5, aggregation: mean}
  - {id: tile5_trimmed, view_set: tile5, aggregation: trimmed}
  - {id: tile5_disagreement_weighted, view_set: tile5, aggregation: disagreement_weighted}
  - {id: tile5_source_anchor_beta_0_25, view_set: tile5, aggregation: source_anchor, beta: 0.25}
  - {id: tile5_source_anchor_beta_0_5, view_set: tile5, aggregation: source_anchor, beta: 0.5}

evaluation:
  probability_threshold: 0.5
  threshold_rule: strict_greater_than
  foreground_connectivity_2d: 8
  min_component_area: 1
  target_matching:
    assignment: hungarian_minimum_centroid_distance
    comparison: strict_less_than
    max_centroid_distance_pixels: 3.0
    one_to_one: true
  froc_probability_thresholds: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

science_gate:
  comparison_tolerance: 1.0e-12
  filter_before_ranking: true
  no_eligible_is_normal_scientific_result: true
  nonclean_36_macro_delta_iou_strictly_greater_than: 0.001
  overall_39_macro_delta_iou_strictly_greater_than: 0.0
  minimum_positive_nonclean_datasets: 2
  worst_nonclean_dataset_delta_iou_minimum: -0.002
  clean_macro_delta_iou_minimum: -0.002
  each_clean_dataset_delta_iou_minimum: -0.005
  nonclean_macro_delta_pd_minimum: -0.01
  each_nonclean_dataset_delta_pd_minimum: -0.02
  fa_delta_maximum_formula:
    units: per_million_pixels
    applies_to: [overall, nonclean, clean, each_dataset, each_corruption_family]
    absolute_allowance: 10.0
    source_multiplier: 0.25
  foreground_fraction:
    delta_maximum: 0.001
    teacher_to_source_multiplier: 1.2
    epsilon: 1.0e-6
  positive_corruption_family_requirement: null
  p5_authorized_on_pass: false
  p5_requires_separate_protocol: true
  ranking_tie_break_order:
    - higher_nonclean_macro_delta_iou
    - higher_overall_macro_delta_iou
    - higher_worst_dataset_delta_iou
    - lower_nonclean_fa_delta
    - lexical_candidate_id

phase_firewall:
  candidate:
    allowed_loader: SourceCalibrationMethodInputDatasetV2
    target_loader_calls: 0
    method_label_accesses: 0
    validation_payload_opens: 0
    test_payload_opens: 0
    model_state_change_allowed: false
    completion_receipt_required: true
  outer:
    candidate_complete_required_before_target_load: true
    allowed_target_role: train_pilot64_outer_target
    targets_visible_to_candidate: false
    validation_payload_opens: 0
    test_payload_opens: 0
  aggregate:
    required_candidate_dataset_artifacts: 3
    required_outer_dataset_artifacts: 3
    required_cell_records_per_candidate: 39
    missing_or_duplicate_cell_action: fail_closed

output:
  root: results/cr_sitta/nonadaptive_teacher_screen_v1
  candidate_phase: candidate_phase
  outer_phase: outer_phase
  aggregate_phase: aggregate_phase/R0
  engineering_phase: engineering_dry_runs/candidate_phase
  atomic_no_replace: true
  refuse_overwrite: true
  existing_verified_complete_action: no_op
  existing_incomplete_or_conflicting_action: fail_closed

objectives:
  entropy_eps: 1.0e-6
  probability_eps: 1.0e-6
  foreground_background_separately_normalized: true
  O0:
    name: global_binary_entropy_negative_control
  O1:
    name: foreground_background_balanced_entropy
    lambda_foreground: 1.0
    lambda_background: 1.0
  O2:
    name: source_anchored_region_balanced_multiview_consistency
    lambda_foreground: 1.0
    lambda_background: 1.0
  O3:
    name: O2_plus_foreground_soft_dice_and_background_soft_bce
    lambda_multiview: 1.0
    lambda_foreground: 1.0
    lambda_background: 1.0
  O4:
    name: O3_plus_foreground_mass_guard
    lambda_multiview: 1.0
    lambda_foreground: 1.0
    lambda_background: 1.0
    lambda_mass: 5.0
    mass_margin: 0.0001
  O5:
    status: deferred_not_silently_substituted
    reason: no independently validated source feature summary usable by both P2 and FiLM

parameter_spaces:
  P2:
    type: bn_affine
    group_spec: decoder_low
    expected_parameter_tensor_count: 16
    expected_scalar_parameter_count: 416
    step_normalization: relative_to_source_parameter_l2
    trust_radius: 0.0005
  DecoderFiLM:
    type: external_decoder0_film
    channels: 16
    max_scale_delta: 0.05
    max_bias: 0.05
    expected_parameter_tensor_count: 2
    expected_scalar_parameter_count: 32
    step_normalization: absolute_l2
    trust_radius: 0.25


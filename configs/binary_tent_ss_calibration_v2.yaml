  target_transition_metrics_used_for_selection: false
  disclosure: >-
    This is source-train-derived method calibration on the frozen Pilot-v2
    64-image subsets. It is not an independent validation set or a paper result.

inherited_source_limitation:
  calibration_checkpoint_role: best_miou
  calibration_checkpoint_selection: test_selected_during_source_training
  application_checkpoint_roles: [best_miou, best_pd]
  best_pd_tuning_episodes: 0
  best_pd_reuses_same_frozen_hyperparameters_without_tuning: true
  same_frozen_train_side_pilot_v2_subset_reused_across_candidates: true
  old_round_02_severity_pilot_subset_used: false
  parent_training_protocol: configs/retrain_fixed_splits.yaml
  parent_training_protocol_sha256: 17a194da4a09972906c24ac7bb25d2dd14b0d6fc67ceb1d7b8aff99f1b43c515
  disclosure: >-
    Source checkpoints were selected using the fixed test split during source
    training. This source-train-side calibration adds no test-image or test-label
    access and cannot repair that inherited checkpoint-selection limitation.
    The independent train-side Pilot-v2 subset is reused across candidates;
    it is not the old round-02 severity-pilot subset. best_pd receives the
    optimizer/LR selected with best_miou and SS evidence,
    with zero additional calibration or tuning episodes.


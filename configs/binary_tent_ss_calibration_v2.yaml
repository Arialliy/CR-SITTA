corruption_conditions:
  base_seed: 42
  count_per_dataset: 13
  ordered:
    - [clean, 0]
    - [gaussian_noise, 1]
    - [gaussian_noise, 3]
    - [gaussian_noise, 5]
    - [gaussian_blur, 1]
    - [gaussian_blur, 3]
    - [gaussian_blur, 5]
    - [low_contrast, 1]
    - [low_contrast, 3]
    - [low_contrast, 5]
    - [stripe_noise, 1]
    - [stripe_noise, 3]
    - [stripe_noise, 5]

method:
  name: Binary Episodic TENT
  entropy_eps: 1.0e-6
  diagnostic_detail: global
  require_nonzero_parameter_update: false
  zero_parameter_update_policy: allow_only_with_one_finite_optimizer_step_temporary_state_and_exact_reset
  update_activity_diagnostics:
    require_nonzero_parameter_update: false
    zero_parameter_update_policy: allow_only_with_one_finite_optimizer_step_temporary_state_and_exact_reset
    optimizer_temporary_state_required: true
    diagnostics_not_used_for_selection: true
    selector_inputs_exclude_strength_diagnostics: true
    artifact_filename: lr_strength_diagnostics.jsonl
    one_record_per_64_image_cell: true
    computed_before_outer_target_loader: true
    uses_target_tensor: false
    probability_transform: metrics.irstd_metrics.probabilities_from_logits
    changed_pixel_rule: strict_probability_gt_0.5_disagreement
    relative_step_norm_definition: step_norm/(source_parameter_norm+epsilon)
    relative_step_norm_epsilon: 1.0e-12
  optimizer_steps_per_image: 1
  amp_enabled: false
  adaptable_parameters: batchnorm2d_affine_only
  selector:
    path: tta/binary_tent_ss_calibration_selector_v2.py
    sha256: 609cbb8582ad7c497075e95d2896675268678d6f73cb4ebec4441911e6a3ca4e
    protocol_id: cr-sitta-binary-tent-ss-calibration-selector-v2
  selection_bn_protocol:
    display_name: SS
    id: source_running_statistics
  BS_excluded_from_selection: true
  application_protocols:
    display_names: [SS, BS]
    ids: [source_running_statistics, single_image_spatial_batch_stats]
  best_pd_reuses_same_frozen_hyperparameters_without_tuning: true
  candidates:
    optimizer_order: [Adam, SGD]
    learning_rates: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3]
    cross_product_count: 10
    shared_across_datasets_and_application_protocols: true

evaluation:
  evaluator: metrics.irstd_metrics.UnifiedResearchEvaluator
  probability_transform: sigmoid_once
  fixed_probability_threshold: 0.5
  froc_probability_thresholds: [0.5]
  threshold_rule: strict_greater_than
  target_threshold_rule: strict_greater_than
  prediction_threshold_rule: strict_greater_than
  connectivity: 2
  max_centroid_distance: 3.0
  centroid_distance_eligibility_rule: strict_less_than
  min_component_area: 1
  target_components: connected_components_of_strictly_positive_target_mask
  prediction_components: connected_components_after_probability_strict_greater_than_threshold
  matching: one_to_one_minimum_total_centroid_distance_over_eligible_pairs
  detected_targets: matched_target_components
  total_targets: target_connected_component_count
  false_alarm_pixels: sum_area_of_unmatched_prediction_components
  selector_cell: dataset_x_SS_x_condition
  cells_per_run: 39
  transition_fields_forbidden: true
  exact_rational_integer_sufficient_statistics: true

selection:
  stage_1:
    candidates: 10
    runs_per_candidate: 1
    fresh_processes: 10
    cells_per_run: 39
    cell_records: 390
    episodes: 24960
  stage_2:
    candidates: 3
    shared_fresh_processes: 2
    same_two_process_ids_each_run_all_top3_candidates: true
    candidate_order: frozen_stage1_top3
    cells_per_candidate_run: 39
    cells_per_process: 117
    episodes_per_process: 7488
    cell_records: 234
    episodes: 14976
  total_episodes: 39936
  best_pd_additional_tuning_episodes: 0
  BS_selection_episodes: 0
  tie_break_order:
    - higher_mean_over_3_runs_macro_global_iou_delta
    - higher_worst_run_macro_global_iou_delta
    - higher_clean_mean_over_3_runs_macro_global_iou_delta
    - lower_mean_over_3_runs_macro_fa_increase_per_million_pixels
    - higher_mean_over_3_runs_macro_pd_delta
    - lower_learning_rate
    - fixed_optimizer_order_Adam_then_SGD
  exact_rational_arithmetic_from_integer_counts: true
  no_numeric_rounding_before_ranking: true

outputs:
  root: results/binary_tent/ss_calibration_v2
  stage1_receipt: stage1/aggregate/stage1_ss_top3_receipt.json
  final_receipt: final/aggregate/final_ss_selection_receipt.json
  update_activity_diagnostics_filename: lr_strength_diagnostics.jsonl
  paper_result: false
  refuse_overwrite: true

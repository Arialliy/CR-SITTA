  source_pre_parity:
    probability_array_bit_exact: true
    binary_mask_array_bit_exact: true
    binary_mask_file_hash_exact: true
    numeric_tolerance_enabled: false
    stored_source_logits_available: false
    logits_proxy_gate: exact_float32_probability_plus_binary_mask

materialized_cache:
  root: results/corruption_cache_fixed_split_v1
  generation_protocol: configs/source_corruption_cache_generation_v1.yaml
  generation_protocol_sha256: c8cdd858e293dbad67660869361637b96af34f54c5cfd36ac127d9ee75fad912
  verify_all_cache_file_hashes: true
  consumer_regeneration_allowed: false
  read_only_mmap: true
  private_sample_copy: true

datasets_order: [IRSTD-1K, NUAA-SIRST, NUDT-SIRST]
ordered_conditions:
  - [clean, 0]
  - [gaussian_noise, 1]
  - [gaussian_noise, 3]
  - [gaussian_noise, 5]
  - [gaussian_blur, 1]
  - [gaussian_blur, 3]
  - [gaussian_blur, 5]
  - [low_contrast, 1]
  - [low_contrast, 3]
  - [low_contrast, 5]
  - [stripe_noise, 1]
  - [stripe_noise, 3]
  - [stripe_noise, 5]

execution:
  seed: 42
  batch_size: 1
  num_workers: 0
  image_size: 256
  expected_batchnorm2d_modules: 53
  formal_worker_visible_cuda_device_count: 1
  model_loads_per_condition_process: 1
  exact_checkpoint_reload_per_condition_process_allowed: true
  condition_order: ordered_conditions
  image_order: cache_manifest_order
  source_pre_forward: every_image
  adabn_post_forward: every_image
  episodic_reset: every_image
  order_isolation_sentinel: first_two_images_A_to_B_and_B_to_A
  order_isolation_sentinel_contributes_to_metrics: false
  state_audit:
    per_image_exact_gpu_parameter_and_buffer_equality: true
    full_state_sha256_cadence:
      first_image: true
      last_image: true
      every_n_images: 64
    failure_action: full_reset_then_abort
    diagnostics_record_audit_kind: true

evaluation:
  probability_transform: sigmoid_once_stable_numpy
  fixed_probability_threshold: 0.5
  threshold_rule: strict_greater_than
  froc_probability_thresholds:
    [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45,
     0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]
  foreground_connectivity_2d: 8
  target_matching:
    assignment: hungarian_minimum_centroid_distance
    max_centroid_distance_pixels: 3.0
    comparison: strict_less_than
    one_to_one: true
  evaluator_reuse: exact_source_benchmark_official_and_unified

outputs:
  formal_root: results/adabn/adabn_batch_stats_v1
  smoke_root: results/adabn/adabn_batch_stats_smoke_v1
  refuse_overwrite: true
  atomic_condition_publish: true
  atomic_dataset_publish: true
  atomic_global_publish: true
  save_all_adabn_probability_maps: true
  probability_storage:
    format: one_numpy_npy_shard_per_condition
    filename: probabilities_256.npy
    dtype: little_endian_float32
    shape: [N, 256, 256]
    per_image_lookup: [probability_shard, probability_shard_index]
  save_all_adabn_binary_masks: true
  save_per_image_records: true
  save_adaptation_diagnostics: true
  formal_condition_sentinel: CONDITION_COMPLETE.json
  formal_dataset_sentinel: DATASET_COMPLETE.json
  formal_global_sentinel: COMPLETE.json
  smoke_condition_sentinel: SMOKE_CONDITION_COMPLETE.json
  smoke_dataset_sentinel: SMOKE_DATASET_COMPLETE.json
  smoke_global_sentinel: SMOKE_COMPLETE.json


execution:
  batch_size: 1
  num_workers: 0
  canonical_order: selected_ids_file_order
  order_check: canonical_then_exact_reverse
  reuse_identical_materialized_inputs_across_orders: true
  expected_batchnorm2d_modules: 53
  probability_transform: sigmoid_once
  fixed_probability_threshold: 0.5
  threshold_rule: strict_greater_than

required_gates:
  - exact_32_parent_pilot_prefix
  - zero_fixed_test_id_overlap
  - zero_test_image_or_mask_opens
  - exact_corrupted_input_hash
  - finite_source_and_adabn_outputs
  - all_parameters_and_buffers_unchanged_before_reset
  - all_bn_running_mean_unchanged
  - all_bn_running_var_unchanged
  - all_bn_num_batches_tracked_unchanged
  - only_runtime_state_changes_during_adabn
  - no_gradients_or_optimizer
  - non_batchnorm_modules_remain_eval
  - per_image_reset_matches_source
  - canonical_reverse_logits_bit_exact
  - at_least_one_probability_map_differs_from_source
  - all_source_and_adabn_outputs_saved

outputs:
  root: results/adabn/adabn_source_pilot_smoke_v1
  dataset_directory: IRSTD-1K
  condition_directory: gaussian_noise_S3
  atomic_sibling_staging: true
  refuse_overwrite: true
  save_all_source_probability_maps: true
  save_all_adabn_probability_maps: true
  save_all_source_binary_masks: true
  save_all_adabn_binary_masks: true
  complete_only_after_all_gates: true

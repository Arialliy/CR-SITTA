  normalization:
    name: ImageNet
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  expected_input_tensor_sequence_sha256: d09021a7c46d95bad657bef79fbbe3dbf35e5b5ed0a8fc565578a60784c60885
